<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CentroPlus - Acceso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(to bottom, #e8f4fc, #cce4f6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 20px;
            width: 360px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
        }

        h2 {
            text-align: center;
            color: #0d2f4f;
            margin-bottom: 8px;
            font-size: 24px;
            font-weight: bold;
        }

        p {
            text-align: center;
            color: #0a2540;
            margin-bottom: 24px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;

            background: rgba(232, 244, 252, 0.8);
            border: 1.5px solid #3a9bd5;
            border-radius: 10px;

            color: #0d2f4f;
            font-size: 14px;

            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #2176ae;
            box-shadow: 0 0 8px rgba(58, 155, 213, 0.3);
        }

        input::placeholder {
            color: rgba(13, 47, 79, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;

            background: linear-gradient(to bottom, #3a9bd5, #2176ae);
            color: white;

            border: none;
            border-radius: 12px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: linear-gradient(to bottom, #4db8f0, #3a9bd5);
            box-shadow: 0 4px 12px rgba(58, 155, 213, 0.35);
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #c0392b;
            text-align: center;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>CentroPlus</h2>
        <p>Acceso al panel de administración</p>
        <form method="POST" action="/do-login">
            <input type="text" name="username" placeholder="DNI" />
            <input type="password" name="password" placeholder="Contraseña" />
            <button type="submit">Entrar</button>
        </form>
        <div class="error">
            <script>
                const params = new URLSearchParams(window.location.search);
                if (params.get('error')) {
                    document.write('DNI o contraseña incorrectos');
                }
            </script>
        </div>
    </div>
</body>

</html>
